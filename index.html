    <!-- The prerender script swaps this whole block per route. -->

    <link

    />

    <script>
      // Apply saved theme before paint to avoid a flash, and raise a flat
      // backdrop if the splash is about to run. Pages are prerendered, so
      // without the backdrop the real content would show for a frame first.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("hk-theme");
          if (t === "light") {
            root.classList.remove("dark");
            root.classList.add("light");
          } else {
            root.classList.add("dark");
          }
        } catch (e) {}
        try {
          if (
            location.pathname === "/" &&
            sessionStorage.getItem("hk-splash-seen") !== "1"
          ) {
            root.classList.add("splash-pending");
          }
        } catch (e) {}
      })();
    </script>
    <noscript>
      <style>
        /* Scroll-reveal starts at opacity 0; without JS it never animates in. */
        [style*="opacity:0"],
        [style*="opacity: 0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Outside #root, so React never sees it and it cannot mismatch. -->
    <div id="splash-shim"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
